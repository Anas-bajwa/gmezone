<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>🐍 Snake — GameZone</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b0e1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-theme="dark">
<div class="gamepage">
  <div class="gamebar">
    <button class="btn ghost" id="backBtn">← Back</button>
    <h2 style="margin:0">🐍 Snake</h2>
    <button class="btn ghost" id="pauseBtn">⏸ Pause</button>
  </div>

  <div class="row" style="justify-content:center; margin-bottom:10px">
    <div class="scorebox">⭐ Score: <b id="score">0</b></div>
    <div class="scorebox">🏆 Best: <b id="best">0</b></div>
  </div>

  <canvas id="snakeCanvas" width="400" height="400"></canvas>

  <!-- On-screen pad for touch devices -->
  <div class="dpad" id="dpad">
    <span></span><button data-dir="up">▲</button><span></span>
    <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
  </div>

  <!-- Start overlay (also the how-to-play) -->
  <div id="startOverlay" class="overlay-screen">
    <div class="overlay-card">
      <h2>🐍 Snake</h2>
      <div class="howto-body">
        <ul>
          <li>Eat the 🍎 apples to grow and score.</li>
          <li>Don't hit the walls or yourself!</li>
          <li><b>Desktop:</b> arrow keys / WASD · <b>P</b> = pause</li>
          <li><b>Mobile:</b> swipe on the board or use the pad below.</li>
        </ul>
      </div>
      <button class="btn primary big" id="startBtn">▶ Start</button>
    </div>
  </div>

  <!-- Game over overlay -->
  <div id="overOverlay" class="overlay-screen" hidden>
    <div class="overlay-card">
      <h2>💀 Game Over</h2>
      <p>⭐ Score: <b id="finalScore">0</b></p>
      <p>🏆 Best: <b id="finalBest">0</b> <span id="newBest" hidden>🎉 New best!</span></p>
      <div class="row" style="justify-content:center">
        <button class="btn primary" id="againBtn">🔄 Play Again</button>
        <button class="btn ghost" id="homeBtn">🏠 Home</button>
      </div>
    </div>
  </div>
</div>

<script src="/sound.js"></script>
<script>
(function () {
  'use strict';
  // theme from hub settings
  try {
    const s = JSON.parse(localStorage.getItem('gz_settings')) || {};
    if (s.theme) document.body.dataset.theme = s.theme;
  } catch {}

  const canvas = document.getElementById('snakeCanvas');
  const ctx = canvas.getContext('2d');
  const N = 20, CELL = canvas.width / N; // 20x20 grid

  let snake, dir, pendingDir, food, score, best, speed, loop, running, paused;

  function getBest() { try { return JSON.parse(localStorage.getItem('gz_scores')).snake || 0; } catch { return 0; } }
  function setBest(v) {
    try {
      const s = JSON.parse(localStorage.getItem('gz_scores')) || {};
      s.snake = v; localStorage.setItem('gz_scores', JSON.stringify(s));
    } catch {}
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; pendingDir = dir;
    score = 0; speed = 140; paused = false;
    document.getElementById('score').textContent = '0';
    document.getElementById('pauseBtn').textContent = '⏸ Pause';
    placeFood();
  }

  function placeFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function tick() {
    dir = pendingDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    // collisions
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      document.getElementById('score').textContent = score;
      Sound.eat();
      speed = Math.max(70, speed - 4); // gets faster
      clearInterval(loop); loop = setInterval(tick, speed);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg2') || '#11162a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // food
    ctx.font = (CELL - 2) + 'px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🍎', food.x * CELL + CELL / 2, food.y * CELL + CELL / 2 + 1);
    // snake
    snake.forEach((s, i) => {
      const hue = 120 - Math.min(60, i * 3);
      ctx.fillStyle = 'hsl(' + hue + ',70%,' + (i === 0 ? '45%' : '38%') + ')';
      const p = 1.5;
      ctx.beginPath();
      ctx.roundRect(s.x * CELL + p, s.y * CELL + p, CELL - p * 2, CELL - p * 2, 5);
      ctx.fill();
      if (i === 0) { // eyes
        ctx.fillStyle = '#fff';
        const ex = s.x * CELL + CELL / 2, ey = s.y * CELL + CELL / 2;
        ctx.beginPath(); ctx.arc(ex - 4 + dir.x * 3, ey - 2 + dir.y * 3, 2.4, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(ex + 4 + dir.x * 3, ey - 2 + dir.y * 3, 2.4, 0, 7); ctx.fill();
      }
    });
  }

  function setDir(x, y) {
    // no 180° turns
    if (dir.x === -x && dir.y === -y) return;
    if (pendingDir.x === -x && pendingDir.y === -y) return;
    pendingDir = { x, y };
  }

  function gameOver() {
    running = false; clearInterval(loop);
    Sound.gameover();
    best = getBest();
    const isBest = score > best;
    if (isBest) { best = score; setBest(best); }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = best;
    document.getElementById('newBest').hidden = !isBest;
    document.getElementById('best').textContent = best;
    document.getElementById('overOverlay').hidden = false;
  }

  function start() {
    document.getElementById('startOverlay').hidden = true;
    document.getElementById('overOverlay').hidden = true;
    reset(); running = true; draw();
    clearInterval(loop); loop = setInterval(tick, speed);
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? '▶ Resume' : '⏸ Pause';
    Sound.click();
    if (paused) clearInterval(loop); else loop = setInterval(tick, speed);
  }

  /* ---- input: keyboard ---- */
  const KEYS = { ArrowUp: [0,-1], w: [0,-1], W: [0,-1], ArrowDown: [0,1], s: [0,1], S: [0,1],
                 ArrowLeft: [-1,0], a: [-1,0], A: [-1,0], ArrowRight: [1,0], d: [1,0], D: [1,0] };
  document.addEventListener('keydown', (e) => {
    if (KEYS[e.key]) { e.preventDefault(); setDir(KEYS[e.key][0], KEYS[e.key][1]); }
    else if (e.key === 'p' || e.key === 'P') togglePause();
    else if (e.key === ' ' && !running) start();
  });

  /* ---- input: swipe ---- */
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault(); // don't scroll while swiping on the board
    if (!touchStart) return;
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: false });

  /* ---- input: on-screen pad ---- */
  document.getElementById('dpad').addEventListener('click', (e) => {
    const d = e.target.dataset && e.target.dataset.dir;
    if (!d) return;
    Sound.click();
    setDir(...{ up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] }[d]);
  });

  /* ---- buttons ---- */
  document.getElementById('startBtn').addEventListener('click', () => { Sound.click(); start(); });
  document.getElementById('againBtn').addEventListener('click', () => { Sound.click(); start(); });
  document.getElementById('homeBtn').addEventListener('click', () => location.href = '/');
  document.getElementById('backBtn').addEventListener('click', () => location.href = '/');
  document.getElementById('pauseBtn').addEventListener('click', togglePause);

  document.getElementById('best').textContent = getBest();
  reset(); draw();
})();
</script>
</body>
</html>
